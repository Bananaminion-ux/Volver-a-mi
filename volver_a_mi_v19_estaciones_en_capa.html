document.addEventListener('click',e=>{const pb=e.target.closest('[data-pause]');if(!pb)return;const action=pb.dataset.pause;if(action==='open')openPause();else if(action==='close')closePause();else if(action==='back'){pauseStep=Math.max(0,pauseStep-1);refreshPause()}else if(action==='next'||action==='skip'){if(pauseStep===4)closePause();else{pauseStep++;refreshPause()}}});document.addEventListener('keydown',e=>{if(!pauseOpen)return;if(e.key==='Escape'){e.preventDefault();closePause()}else if(e.key==='Tab'){const dialog=document.querySelector('.pause-dialog');const els=[...dialog.querySelectorAll('button:not([disabled]),[tabindex="-1"]')];const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});app.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-thought-flag]')){const [caseId,flagId]=el.dataset.thoughtFlag.split(':');local['tflag'+caseId+'_'+flagId]=el.checked;}});app.addEventListener('input',e=>{if(e.target.id==='thoughtNote')local['thoughtNote'+step]=e.target.value;});app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;if(act.startsWith('emotion:')){const n=Number(act.slice(8));const region=app.querySelector('.workbook-only');if(region){region.outerHTML=renderEmotions(n);app.querySelector('[data-action="emotion:'+n+'"]')?.focus()}return}if(act==='home'){showHome();scrollTo(0,0)}else if(act==='openStations'){const layer=document.getElementById('stationLayer');const trigger=app.querySelector('.station-open');if(layer&&trigger){layer.hidden=false;trigger.setAttribute('aria-expanded','true');document.getElementById('stationLayerTitle')?.focus();}}else if(act==='closeStations'){const layer=document.getElementById('stationLayer');const trigger=app.querySelector('.station-open');if(layer&&trigger){layer.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}}else if(act.startsWith('station:'))showStation(act.slice(8));else if(act.startsWith('start:'))start(act.slice(6));else if(act.startsWith('choose:')){answers[step]=Number(act.slice(7));render()}else if(act==='next'){step++;render();window.scrollTo(0,0)}else if(act.startsWith('first:')){local['first'+step]=Number(act.slice(6));render()}else if(act==='reveal'){local['phase'+step]=1;render()}else if(act==='repeat'){start(current)}else if(act.startsWith('safe:')){local.safe=Number(act.slice(5));render()}else if(act==='safeReset'){delete local.safe;render()}else if(act.startsWith('copy:')){let el=document.getElementById(act.slice(5));if(el&&navigator.clipboard?.writeText){navigator.clipboard.writeText(el.value).then(()=>{const m=document.createElement('p');m.setAttribute('role','status');m.textContent='Reflexión copiada. Decide dónde guardarla y quién puede verla.';el.after(m)}).catch(()=>{el.focus();el.select()})}else if(el){el.focus();el.select()}}else if(act==='finish'){finish('Una nueva forma de hablarte','No necesitas creer todas las frases que aparecen en tu mente.','Practica una respuesta respetuosa contigo en una situación real.')}else if(act.startsWith('reto:')){local.retoElegido=Number(act.slice(5));delete local.retoEstado;render();document.getElementById('retoDetalle')?.scrollIntoView({block:'nearest',behavior:'instant'})}else if(act.startsWith('retoEstado:')){local.retoEstado=act.slice(11);render();document.getElementById('retoDetalle')?.scrollIntoView({block:'nearest',behavior:'instant'})}else if(act.startsWith('toggle:')){let i=act.slice(7);local[i]=!local[i];render()}else if(act.startsWith('challenge:')){local.challenge=Number(act.slice(10));render()}});
