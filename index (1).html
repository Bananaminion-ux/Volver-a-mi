<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#e9eee7"><title>Volver a mí | Experiencias digitales</title><style>
:root{--bg:#f7f4ed;--ink:#34443e;--muted:#69776e;--sage:#dce8dc;--pink:#f2ded8;--clay:#ba7864;--gold:#d9bb80;--white:#fffefa;--line:#e5e4d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}h1,h2,h3{font-family:Georgia,serif;line-height:1.16;font-weight:500}h1{font-size:clamp(2.8rem,8vw,5rem);margin:.3em 0}h2{font-size:clamp(2rem,5vw,3rem);margin:.3em 0}h3{font-size:1.45rem}p{margin:.65em 0 1em}.shell{max-width:1040px;margin:auto;padding:20px}.hero{background:radial-gradient(circle at 88% 10%,#f1dcd2 0,transparent 34%),linear-gradient(145deg,#e2ebdf,#f8f2e9);border-radius:30px;padding:clamp(25px,6vw,65px);position:relative;overflow:hidden;min-height:360px}.hero:after{content:'✺';position:absolute;right:7%;bottom:-80px;font-size:280px;color:#c8d8c4;opacity:.65;pointer-events:none}.hero>*{position:relative;z-index:1}.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:#6f776b;font-weight:750}.lead{font-size:1.12rem;max-width:620px}.btn,button{font:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #aa7866;outline-offset:3px}.btn{border:1px solid #a6b9a7;background:var(--white);border-radius:16px;padding:13px 18px;color:var(--ink);font-weight:650;min-height:48px}.btn.primary{background:#466a5c;color:white;border-color:#466a5c}.btn:hover{filter:brightness(.97)}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 20px}.brand{font:1.2rem Georgia,serif}.small{font-size:.86rem;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin:20px 0 35px}.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:start;min-height:225px}.card .symbol{font-size:2.5rem;margin-bottom:8px}.card h3{margin:0}.card p{color:var(--muted);font-size:.92rem;flex:1}.station{margin-top:30px}.station>h2{font-size:1.9rem}.panel{background:var(--white);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,5vw,42px);max-width:760px;margin:20px auto;box-shadow:0 10px 30px #3143360b}.progress{height:7px;border-radius:99px;background:#e6e9df;overflow:hidden;margin:18px 0}.progress>span{display:block;height:100%;background:#8da993;transition:width .2s}.choices{display:grid;gap:10px;margin:18px 0}.choice{width:100%;text-align:left;background:#f8f7f1;border:1px solid #dfe5dc;border-radius:16px;padding:15px;min-height:54px;color:var(--ink)}.choice[aria-pressed=true]{background:#dfe9df;border:2px solid #5c806d;padding:14px}.feedback{border-left:4px solid var(--clay);background:#fbf1e9;padding:15px 18px;border-radius:0 15px 15px 0;margin-top:20px}.feedback strong{display:block;margin-bottom:5px}.prompt{font:1.35rem/1.4 Georgia,serif;margin:20px 0}.textarea{width:100%;min-height:105px;border:1px solid #cad6ca;background:#fff;border-radius:15px;padding:13px;font:inherit;color:var(--ink);resize:vertical}.tag{display:inline-block;background:var(--sage);padding:5px 12px;border-radius:99px;font-size:.8rem;margin:4px 4px 4px 0}.pill{display:inline-flex;padding:9px 12px;border-radius:12px;background:#f5ede6;margin:4px}.muted{color:var(--muted)}.privacy{background:#eef2eb;border-radius:20px;padding:20px;margin:28px 0}.privacy p{font-size:.9rem}.foot{border-top:1px solid var(--line);margin-top:35px;padding:22px 0;font-size:.85rem;color:var(--muted)}.hidden{display:none!important}.emotion-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.emotion-grid button{text-align:center}.scale{width:100%;accent-color:#658a76}.scene{font-size:3.5rem;text-align:center;background:linear-gradient(130deg,#e5eee5,#f4e3dc);border-radius:22px;padding:22px;margin:12px 0}.casefile{border:1px dashed #bcac93;border-radius:16px;background:#fbf7ee;padding:17px;margin:14px 0}.casefile h3{margin:0 0 8px}.steps{display:flex;gap:8px;flex-wrap:wrap}.step{background:#e9eee7;padding:7px 11px;border-radius:99px;font-size:.8rem}.checkgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.checkgrid button{aspect-ratio:1.3;padding:8px;font-size:.85rem;border-radius:12px;border:1px solid #d6ded3;background:#fff}.checkgrid button.done{background:#dce8dc;text-decoration:line-through}.voices{display:grid;gap:10px}.safe{background:#eef2eb;border:2px solid #7d9c88;padding:18px;border-radius:18px}.reflection-prompt{padding:14px;background:#f2eee4;border-radius:15px;margin:14px 0}.microstep{font-weight:650;color:#365f50}.scene{transition:background .25s ease,transform .25s ease}.choice:hover{border-color:#698c78;background:#edf3eb}.choice:focus-visible{outline:3px solid #6b4a91;outline-offset:3px}.choice:disabled{cursor:not-allowed;opacity:.6} .choice[aria-pressed=true]{border-color:#365e4e}.scene[aria-hidden=true]{user-select:none}@media(min-width:700px){.voices{grid-template-columns:repeat(2,1fr)}}.voices>div,.reflection{background:#f7f5ee;border:1px solid var(--line);border-radius:15px;padding:13px 16px;margin:10px 0}.voices p{margin:5px 0}.privacy-inline{margin-top:22px;padding:12px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}.privacy-inline summary{cursor:pointer;font-weight:650}.notice{font-size:.85rem;color:#68746c}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:480px){.shell{padding:12px}.hero{border-radius:22px}.checkgrid{grid-template-columns:repeat(3,1fr)}.panel{border-radius:20px}.hero:after{font-size:190px;bottom:-40px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media(prefers-contrast:more){.choice,.btn,.panel{border-color:#34443e}.muted,.small{color:#34443e}}</style></head><body><div class="shell"><header class="nav"><span class="brand">✺ Volver a mí</span><button class="btn" id="homeBtn">Biblioteca</button></header><main id="app" aria-live="off"></main><footer class="foot">© Volver a mí · Recurso de reflexión y aprendizaje emocional. Material psicoeducativo, no es psicoterapia ni un servicio de crisis. Si estás en peligro inmediato, solicita ayuda a los servicios de emergencia de tu localidad.</footer></div><script>
'use strict';
const modules=[
{id:'emociones',station:'Lo que siento',icon:'🌿',name:'Explorador emocional',desc:'Pon nombre a lo que sientes y descubre qué podrías necesitar.',time:'5 min'},
{id:'pensamientos',station:'Lo que pienso',icon:'🔎',name:'Detective de pensamientos',desc:'Investiga pistas antes de creer una interpretación.',time:'6 min'},
{id:'rio',station:'Lo que pienso',icon:'⛵',name:'El río de la incertidumbre',desc:'Navega una duda sin tener que resolverlo todo.',time:'5 min'},
{id:'teatro',station:'Lo que pienso',icon:'🎭',name:'El teatro de mi voz interior',desc:'Escucha tres voces y crea una respuesta más cuidadosa.',time:'7 min'},
{id:'culpa',station:'Lo que permito',icon:'🗂️',name:'Detective: el caso de la culpa',desc:'Examina acuerdos, expectativas y responsabilidades.',time:'7 min'},
{id:'limites',station:'Lo que permito',icon:'🚦',name:'Simulador de límites',desc:'Practica conversaciones difíciles con distintos niveles de firmeza.',time:'6 min'},
{id:'rechazo',station:'Lo que permito',icon:'🚪',name:'¿Y si no les agrado?',desc:'Explora elecciones ante el desacuerdo y el temor al rechazo.',time:'6 min'},
{id:'bingo',station:'Lo que elijo',icon:'🌱',name:'Bingo de autonomía',desc:'Elige pequeños actos de autonomía, a tu ritmo.',time:'variable'},
{id:'constelacion',station:'Lo que elijo',icon:'✨',name:'Constelación de relaciones',desc:'Observa reciprocidad, necesidades y límites en tus vínculos.',time:'8 min'},
{id:'valentia',station:'Lo que elijo',icon:'🪴',name:'Una semilla de valentía',desc:'Prepara un experimento pequeño y seguro para la vida real.',time:'4 min'},
{id:'espejo',station:'Integración',icon:'🪞',name:'El espejo de mis decisiones',desc:'Reconoce tendencias sin etiquetas ni calificaciones.',time:'6 min'}
];
const app=document.getElementById('app');let current=null,step=0,answers=[],local={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(t,fn,primary=false){return `<button class="btn ${primary?'primary':''}" data-action="${fn}">${t}</button>`}
function feedback(text,action=''){return `<div class="feedback" role="status"><strong>Lo que puedes observar</strong><p>${text}</p>${action?`<p class="microstep">Para explorar: ${action}</p>`:''}</div>`}
function showHome(preserveHash=false){current=null;step=0;answers=[];local={};if(!preserveHash){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}app.innerHTML=`<section class="hero"><div class="eyebrow">Un espacio para volver a ti</div><h1>Volver a mí</h1><p class="lead">Experiencias breves para reconocer lo que sientes, cuestionar pensamientos, practicar límites y elegir con mayor libertad.</p><p><em>No necesito dejar de sentir para comenzar a elegirme.</em></p>${btn('Explorar experiencias','explore',true)}</section><aside class="privacy"><strong>🔒 Tu espacio, tus respuestas</strong><p>No necesitas una cuenta. Esta aplicación no envía tus respuestas a servidores ni las guarda en almacenamiento del navegador. Solo permanecen temporalmente en esta pestaña mientras realizas la actividad; al recargar o cerrar, se pierden. No incluye analítica ni rastreadores en este archivo. Si se publica en una plataforma, el proveedor de alojamiento podría registrar datos técnicos de acceso, como la dirección IP.</p><p>Estas experiencias no constituyen una evaluación clínica. Si el malestar persiste o interfiere con tu vida, considera consultar a un profesional de psicología o salud mental. Puedes detener cualquier ejercicio cuando lo necesites. No practiques confrontaciones que puedan ponerte en peligro.</p></aside><div id="library"></div>`;let html='';for(const station of [...new Set(modules.map(x=>x.station))]){html+=`<section class="station"><h2>${station}</h2><div class="cards">`;for(const m of modules.filter(x=>x.station===station)){html+=`<article class="card"><span class="symbol" aria-hidden="true">${m.icon}</span><span class="small">${m.time}</span><h3>${m.name}</h3><p>${m.desc}</p>${btn('Comenzar →','start:'+m.id)}</article>`}html+='</div></section>'}document.getElementById('library').innerHTML=html;let anchor=decodeURIComponent(location.hash.slice(1));if(modules.some(x=>x.id===anchor))start(anchor)}
function start(id){current=id;step=0;answers=[];local={};try{history.replaceState(null,'',location.pathname+location.search+'#'+id)}catch(e){}render();scrollTo(0,0)}
function frame(title,subtitle,body,percent=20){app.innerHTML=`<div class="panel"><div class="eyebrow">${esc(modules.find(x=>x.id===current).station)} · experiencia digital</div><h2>${title}</h2><p class="muted">${subtitle}</p><div class="progress" aria-label="Progreso aproximado"><span style="width:${percent}%"></span></div>${body}<div class="btnrow">${btn('← Biblioteca','home')}</div><details class="privacy-inline"><summary>Privacidad y orientación profesional</summary><p>No se requieren cuentas ni se transmiten las respuestas. Los datos escritos solo permanecen temporalmente en esta pestaña y se pierden al cerrarla o actualizarla.</p><p>Este recurso no diagnostica ni sustituye la atención psicológica. Si el malestar afecta tu vida, consulta con un profesional.</p></details></div>`;const h=app.querySelector("h2");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:"instant"})}
function options(arr){return `<div class="choices">${arr.map((v,i)=>`<button class="choice" data-action="choose:${i}" aria-pressed="${answers[step]===i}">${esc(v)}</button>`).join('')}</div>`}
function nextFeedback(message,action){return feedback(message,action)+`<div class="btnrow">${btn('Continuar →','next',true)}</div>`}
function choiceScenario(title,subtitle,scenario,opts,notes,action){let selected=answers[step];frame(title,subtitle,`<div class="scene" aria-hidden="true">${scenario.icon}</div><div class="prompt">${scenario.text}</div>${options(opts)}${selected!==undefined?nextFeedback(`<b>Esta elección podría llevarte a:</b> ${esc(notes[selected])}`,action):'<p class="notice">Selecciona una respuesta para explorar lo que podría ocurrir.</p>'}`,35+step*15)}
const thoughtCases=[{text:'Enviaste un mensaje y todavía no recibes respuesta. Piensas: «Seguro está molesta conmigo». ¿Qué es un hecho?',opts:['No ha respondido todavía.','Está molesta conmigo.','Ya no le importo.'],notes:['Exacto: solo sabes que aún no ha respondido. El motivo sigue siendo desconocido.','Eso es una hipótesis, no una prueba. Tu mente intenta llenar un vacío de información.','Es una conclusión más amplia que los hechos disponibles.'],action:'Antes de concluir, escribe una explicación alternativa.'},{text:'Después de una reunión piensas: «Hice el ridículo». ¿Qué pista sería más útil?',opts:['Recordar solo el momento incómodo.','Identificar qué dijiste y qué respuestas observaste.','Preguntar a todos si les caíste bien.'],notes:['Una sola escena puede distorsionar la valoración del conjunto.','Observar hechos concretos permite evaluar con más equilibrio.','Pedir tranquilidad puede aliviar a corto plazo, pero reforzar la necesidad de confirmación.'],action:'Describe un hecho sin adjetivos sobre ti.'},{text:'Una persona hizo un comentario ambiguo. ¿Qué conclusión provisional ayuda más?',opts:['Sin duda fue una crítica.','No tengo datos suficientes para saber qué quiso decir.','Debo analizarlo hasta entenderlo perfectamente.'],notes:['La ambigüedad no confirma una intención negativa.','Aceptar que aún no sabes puede disminuir las interpretaciones precipitadas.','Pensar más no siempre aporta información nueva.'],action:'Prueba continuar con tu día sin resolver esta duda ahora.'}];
const guiltCases=[{text:'Rechazaste una invitación porque necesitabas descansar. La otra persona dice: «Pensé que podía contar contigo».',clues:['No habías confirmado que asistirías.','Habías trabajado toda la semana y estabas agotada.','La otra persona se sintió decepcionada.'],opts:['Hice algo malo porque se decepcionó.','Su decepción es real, pero no demuestra que incumplí un compromiso.','Debo aceptar la próxima invitación para compensar.'],notes:['La emoción ajena merece respeto, pero no es por sí sola prueba de una falta.','Distingues el sentimiento de la otra persona de tu responsabilidad.','Compensar por culpa puede llevarte a ignorar tus necesidades.']},{text:'Prometiste ayudar a una amiga el sábado, pero olvidaste avisarle que no podrías ir.',clues:['Había un acuerdo explícito.','No avisaste del cambio.','Tu amiga tuvo que reorganizarse.'],opts:['No importa, cada quien resuelve lo suyo.','Puedo reconocer el incumplimiento, disculparme y acordar cómo repararlo.','Soy una mala amiga y debo aceptar cualquier petición futura.'],notes:['Aquí sí había una responsabilidad concreta que merece atención.','Reconocer el daño y reparar no exige castigarte indefinidamente.','Un error no define tu valor ni obliga a aceptar todo en adelante.']},{text:'Un familiar te pide información privada de tu pareja y se molesta cuando no se la das.',clues:['No se trata de información tuya para compartir libremente.','La persona insiste.','La molestia aparece después de tu negativa.'],opts:['Debo contarle para mantener la paz.','Puedo cuidar la privacidad aunque alguien se incomode.','Nunca debo hablar con ese familiar.'],notes:['Ceder para evitar tensión puede vulnerar un límite legítimo.','La incomodidad ajena no invalida un límite respetuoso.','Una situación difícil no obliga a cortar el vínculo; puedes valorar opciones.']}];
const mirrorScenes=[{text:'Te piden un favor cuando necesitas descansar. ¿Qué harías primero?',opts:['Aceptaría para evitar que se molesten.','Pediría tiempo para decidir.','Diría que no de manera clara.']},{text:'Alguien cuestiona una decisión personal. ¿Qué te resulta más cercano?',opts:['Revisaría mi decisión repetidamente para agradar.','Escucharía y contrastaría con mis valores.','Defendería mi decisión sin escuchar nada.']},{text:'No recibes la respuesta que esperabas. ¿Qué sueles hacer?',opts:['Buscaría señales o confirmaciones una y otra vez.','Reconocería la incertidumbre y esperaría un tiempo.','Supondría inmediatamente lo peor.']}];
function render(){if(!current)return showHome();switch(current){
case 'emociones':{const names=['Alegría','Tristeza','Miedo','Enojo','Vergüenza','Culpa','Calma','Frustración','Soledad','Esperanza','Confusión','Gratitud'];let name=local.emotion;frame('Explorador emocional','Una emoción no necesita justificarse para ser reconocida.',`<div class="scene">🌦️</div><p class="prompt">¿Qué emoción se parece más a lo que sientes ahora?</p><div class="emotion-grid">${names.map(n=>`<button class="choice" aria-pressed="${name===n}" data-action="emotion:${n}">${n}</button>`).join('')}</div>${name?`<label for="intensity">Intensidad: <b id="intVal">${local.intensity??5}</b> de 10</label><input class="scale" id="intensity" type="range" min="0" max="10" value="${local.intensity??5}"><label for="need">¿Qué podría ayudarte en este momento?</label><textarea class="textarea" id="need" placeholder="Por ejemplo: descansar, conversar, tomar distancia...">${esc(local.need||'')}</textarea>${feedback('Nombrar una emoción puede ayudarte a observarla con más claridad. Su intensidad no determina lo que debes hacer.','Pregunta qué necesitas antes de intentar cambiar lo que sientes.')}`:''}`,name?75:30);break}
case 'pensamientos':{let c=thoughtCases[step];if(!c){finish('Has investigado tres interpretaciones.','Una hipótesis no es un hecho, aunque se sienta convincente.','Cuando aparezca una conclusión rápida, pregunta: «¿Qué sé realmente?»');break}choiceScenario('Detective de pensamientos',`Caso ${step+1} de 3 · Busca pruebas, no certezas`,{icon:'🔎',text:c.text},c.opts,c.notes,c.action);break}
case 'culpa':{
let c=guiltCases[step];if(!c){finish('Expedientes cerrados','Sentir culpa no demuestra por sí solo una falta. Puedes examinar acuerdos, efectos y necesidades sin condenarte.','¿Qué dato adicional te haría reconsiderar una conclusión?');break}
let phase=local['phase'+step]||0,first=local['first'+step],selected=answers[step],note=local['clueNote'+step]||'';
let intro=`<div class="casefile"><h3>📁 Expediente ${step+1}</h3><p>${esc(c.text)}</p></div>`;
if(!phase){frame('Detective: el caso de la culpa',`Caso ${step+1} de 3 · Hipótesis inicial`,intro+`<p class="prompt">¿Qué sospechas antes de examinar las pruebas?</p><div class="choices">${['Puede existir una responsabilidad concreta.','Quizá se trata de una expectativa ajena.','Todavía faltan datos para saberlo.'].map((t,i)=>`<button class="choice" data-action="first:${i}" aria-pressed="${first===i}">${t}</button>`).join('')}</div>${first!==undefined?btn('Abrir el sobre de pistas →','reveal',true):''}`,22+step*20);break}
frame('Detective: el caso de la culpa',`Caso ${step+1} de 3 · Reconstrucción`,intro+`<div class="casefile"><h3>✉️ Pistas</h3><ol>${c.clues.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div><p class="small">Primera hipótesis: ${['Posible responsabilidad','Posible expectativa','Información insuficiente'][first]}</p><p class="prompt">¿Qué conclusión provisional elegirías?</p>${options(c.opts)}${selected!==undefined?`<div class="reflection-prompt"><strong>Consecuencia posible</strong><p>${esc(c.notes[selected])}</p><p>Tu hipótesis puede cambiar cuando aparece información nueva.</p></div><label for="clueNote">¿Qué dato podría cambiar tu interpretación?</label><textarea class="textarea" id="clueNote" data-step="${step}" placeholder="Un acuerdo, una conversación pendiente, un efecto que desconozco...">${esc(note)}</textarea>${feedback('Distingue lo que hiciste, el efecto de tu conducta y lo que otra persona esperaba. No siempre coinciden.','Si hubo daño, considera una reparación proporcionada. Si hay presión, prioriza tus límites y seguridad.') }<div class="btnrow">${btn('Cerrar expediente →','next',true)}</div>`:'<p class="notice">No hay veredicto definitivo: elige una lectura provisional.</p>'}`,42+step*16);break}
case 'rio':{let c=[{text:'Surge la duda: «¿Y si mañana algo sale mal?». ¿Cómo quieres avanzar?',opts:['Revisar mentalmente todas las posibilidades.','Identificar una preparación útil y detener la revisión.','Evitar por completo la situación.'],notes:['Imaginar escenarios sin fin puede dar sensación de control sin aportar soluciones.','Una acción proporcionada permite avanzar sin certeza absoluta.','Evitar puede aliviar ahora, pero conservar el temor para después.']},{text:'Ya hiciste lo que estaba en tus manos, pero la inquietud continúa.',opts:['Buscar más garantías hasta sentir tranquilidad total.','Permitir la incomodidad y volver a una actividad valiosa.','Reprocharte por seguir sintiendo miedo.'],notes:['La certeza total rara vez está disponible.','Puedes sentir incertidumbre y continuar con tu vida.','Criticarte por sentir no suele ayudar a regularte.']}][step];if(!c){finish('Llegaste a la otra orilla','Aceptar la incertidumbre no es resignarse; es reconocer los límites de lo que puedes saber.','Elige una acción útil y deja pendiente lo que no puedes resolver ahora.');break}choiceScenario('El río de la incertidumbre',`Tramo ${step+1} de 2 · No necesitas controlar el río`,{icon:'⛵',text:c.text},c.opts,c.notes[0]?[...c.notes]:[], 'Observa si estás resolviendo un problema o alimentando una preocupación.');break}
case 'teatro':{
let c=[['Cometiste un error delante de otras personas.','Siempre lo arruino todo.','Podría alejarme un momento para calmarme.','Fue incómodo; puedo reconocer el error y aprender.','¿Qué necesitarías para reparar o aprender?'],['Alguien te hace una observación inesperada.','No sirvo para esto.','Puedo tomar distancia antes de responder.','Escucharé lo útil sin convertirlo en un juicio sobre mi valor.','¿Qué parte de la observación es concreta y verificable?'],['Estás agotada y no logras terminar todas tus tareas.','Debería poder con todo.','Descansar puede ser necesario; también puedo posponer algo.','Mis recursos tienen límites y puedo priorizar.','¿Qué tarea es esencial y cuál puede esperar?']][step];
if(!c){frame('El teatro de mi voz interior','Último acto · Tú escribes la siguiente línea',`<div class="scene" aria-hidden="true">🎭</div><p>Escribe una respuesta que reconozca el hecho, respete tus emociones y permita actuar. También puedes dejarla en blanco.</p><label for="reflection">Mi voz consciente</label><textarea class="textarea" id="reflection" placeholder="Lo que ocurrió... Lo que necesito... Un paso posible...">${esc(local.reflection||'')}</textarea>${feedback('No tienes que convencerte de una frase positiva. Una respuesta útil puede ser realista, cuidadosa y breve.','Puedes copiar tu frase para compartirla voluntariamente con tu terapeuta o conservarla para ti.') }<div class="btnrow">${btn('Copiar mi reflexión','copy:reflection')}${btn('Cerrar el telón','finish',true)}</div>`,96);break}
let sel=answers[step],observer=['La crítica generaliza un error. La voz observadora puede separar el hecho de la identidad.','Una pausa puede ser una protección útil. Pregunta si te ayuda a volver o si te aleja indefinidamente de algo valioso.','Una voz consciente reconoce límites, necesidades y posibilidades sin exigirte perfección.'];
frame('El teatro de mi voz interior',`Acto ${step+1} de 3 · Escucha las cuatro perspectivas`,`<div class="scene" aria-hidden="true">🎭</div><p class="prompt">${esc(c[0])}</p><div class="voices"><div><strong>Voz crítica</strong><p>«${esc(c[1])}»</p></div><div><strong>Voz protectora</strong><p>«${esc(c[2])}»</p></div><div><strong>Voz consciente</strong><p>«${esc(c[3])}»</p></div><div><strong>Voz observadora</strong><p>«Puedo escuchar estas voces sin obedecerlas automáticamente».</p></div></div><p class="prompt">¿Cuál es tu respuesta más cercana en este momento?</p>${options(['Me quedo con la voz crítica','Necesito protegerme o hacer una pausa','Intentaré una respuesta consciente'])}${sel!==undefined?nextFeedback(observer[sel],c[4]):'<p class="notice">Todas las voces pueden contener información. Explora su utilidad según el contexto.</p>'}`,25+step*20);break}
case 'limites':{
let safety=local.safe;
if(safety===undefined){frame('Simulador de límites','Primero, tu seguridad',`<div class="safe"><h3>Antes de practicar</h3><p>¿Te sientes en condiciones de expresar un desacuerdo sin temer amenazas, represalias o violencia?</p></div><div class="choices">${['Sí, es una situación de bajo riesgo.','No estoy segura o no lo sé.','No; temo represalias, control o daño.'].map((t,i)=>`<button class="choice" data-action="safe:${i}">${t}</button>`).join('')}</div><p class="small">No necesitas contar detalles personales. Puedes abandonar la actividad.</p>`,12);break}
if(safety!==0){frame('Simulador de límites','Una pausa también es una decisión válida',`<div class="safe"><h3>Prioriza tu seguridad</h3><p>Cuando hay temor, control, amenazas o desigualdad de poder, practicar una confrontación puede no ser seguro. No tienes obligación de decir «no» directamente ni de explicar tus motivos.</p><p>Considera buscar apoyo confidencial de una persona o profesional de confianza y valorar opciones seguras. Si existe peligro inmediato, contacta servicios de emergencia locales.</p></div>${feedback('Evitar una confrontación peligrosa no es falta de autonomía.','Puedes explorar por escrito lo que necesitas sin comunicarlo a la otra persona.') }<div class="btnrow">${btn('Explorar otra experiencia','home',true)}${btn('Revisar mi respuesta','safeReset')}</div>`,100);break}
let c=[{text:'Una persona de confianza te pide quedarte más tiempo después de una actividad, pero necesitas descansar.',opts:['Aceptar aunque hoy no puedas.','Pedir tiempo para decidir.','Decir que hoy no puedes y ofrecer otra opción si quieres.'],notes:['Ceder puede ser una elección legítima, pero conviene observar si se repite por temor.','Tomar tiempo te permite reconocer tus recursos antes de comprometerte.','Un límite claro puede cuidar tus necesidades; no siempre exige una explicación extensa.']},{text:'La persona insiste: «Solo serán unos minutos». La situación sigue siendo segura.',opts:['Aceptar para terminar la conversación.','Repetir el límite con calma.','Proponer hablar en otro momento.'],notes:['Aceptar puede evitar incomodidad inmediata; observa si coincide con lo que deseas.','Repetir un límite es una posibilidad, no una obligación universal.','Posponer también puede ser una alternativa válida si necesitas espacio.']}][step];
if(!c){finish('Has explorado límites posibles','Un límite puede expresarse, negociarse o posponerse según la relación y el contexto.','Practica solo en escenarios seguros y con libertad para detenerte.');break}
choiceScenario('Simulador de límites',`Escena ${step+1} de 2 · Situación de bajo riesgo`,{icon:'🚦',text:c.text},c.opts,c.notes,'¿Qué opción cuida tus necesidades y también considera la seguridad?');break}
case 'rechazo':{let c=[{text:'Tu grupo propone un plan que no te gusta. ¿Cómo responderías?',opts:['Aceptar sin expresar mi preferencia.','Decir con respeto que prefiero otra opción.','Criticar el plan de los demás.'],notes:['Callar evita el desacuerdo, pero también oculta tus preferencias.','Expresar una diferencia no equivale a rechazar a las personas.','Descalificar a otros no es necesario para mostrar una preferencia.']},{text:'Una persona no está de acuerdo contigo y parece decepcionada.',opts:['Cambiar de opinión de inmediato.','Escucharla y sostener tu criterio si sigue teniendo sentido.','Pensar que la relación está arruinada.'],notes:['Ceder por miedo puede alejarte de tus valores.','El desacuerdo y el respeto pueden coexistir.','Una reacción puntual no determina el futuro del vínculo.']}][step];if(!c){finish('Elegir también implica tolerar diferencias','No puedes controlar todas las opiniones, pero sí cómo expresas las tuyas.','Si es seguro, expresa una preferencia con alguien de confianza o ensáyala por escrito.');break}choiceScenario('¿Y si no les agrado?',`Decisión ${step+1} de 2 · Dos caminos, muchas posibilidades`,{icon:'🚪',text:c.text},c.opts,c.notes,'Observa qué temes perder al expresar una opinión propia.');break}
case 'bingo':{let items=['Expreso una preferencia','Pido tiempo para decidir','Acepto un cumplido','Pido ayuda','Digo un no respetuoso','Hago una pausa sin culpa','Tolero un desacuerdo','Identifico una necesidad','Elijo algo por mí'];frame('Bingo de autonomía','No hay plazo ni premio. Elige solo retos seguros y adecuados a tu contexto.',`<div class="scene">🌱</div><div class="checkgrid">${items.map((x,i)=>`<button class="${local[i]?'done':''}" data-action="toggle:${i}" aria-pressed="${!!local[i]}">${local[i]?'✓ ':''}${x}</button>`).join('')}</div>${feedback('Cada intento cuenta, incluso si hubo nervios o incomodidad.','Elige un reto pequeño; no necesitas completar todo el tablero.')}`,65);break}
case 'constelacion':{let labels=['Puedo expresar mis necesidades','Hay reciprocidad','Respeta mis límites','Puedo disentir sin temor','No hay amenazas, vigilancia ni control'];frame('Constelación de relaciones','Piensa en un vínculo, sin escribir nombres ni información identificable.',`<div class="scene">✨</div><p class="prompt">¿Qué señales reconoces en esta relación?</p><div class="choices">${labels.map((x,i)=>`<button class="choice" aria-pressed="${!!local[i]}" data-action="toggle:${i}">${local[i]?'✦ ':'☆ '}${x}</button>`).join('')}</div><label for="relationNote">¿Qué te gustaría comunicar o cuidar?</label><textarea id="relationNote" class="textarea" placeholder="Una necesidad o límite concreto...">${esc(local.relationNote||"")}</textarea>${feedback('Una relación no se define por una señal aislada. Sin embargo, amenazas, vigilancia o coerción requieren priorizar tu seguridad, no esperar a que el patrón se repita.','No tienes que confrontar a nadie. Si existe control o temor, busca apoyo confidencial y evita dejar registros que puedan ponerte en riesgo.')}`,70);break}
case 'valentia':{let challenges=['Expresar una preferencia pequeña','Pedir una aclaración sin disculparme','Decir que necesito tiempo','Dejar una duda sin revisar durante un rato'];frame('Una semilla de valentía','Un experimento gradual, no una prueba de valor personal.',`<div class="scene">🪴</div><p class="prompt">¿Qué pequeña acción se ajusta a tu situación?</p><div class="choices">${challenges.map((x,i)=>`<button class="choice" aria-pressed="${local.challenge===i}" data-action="challenge:${i}">${x}</button>`).join('')}</div>${local.challenge!==undefined?`<p><b>Tu semilla:</b> ${challenges[local.challenge]}</p><label for="when">¿Cuándo y en qué contexto seguro podrías intentarlo?</label><textarea class="textarea" id="when" placeholder="Por ejemplo, mañana al elegir dónde almorzar...">${esc(local.when||"")}</textarea>${feedback('El progreso no consiste en actuar sin miedo, sino en ampliar gradualmente tus posibilidades.','Ante amenazas o coerción, evita el reto y prioriza tu seguridad.')}`:''}`,75);break}
case 'espejo':{
let c=mirrorScenes[step];if(!c){let reflections=[
['Aceptar podría cuidar la relación, pero conviene explorar si también atiende tus necesidades.','Pedir tiempo abre espacio para decidir sin presión.','Negarte puede ser adecuado si es seguro y corresponde a tus posibilidades.'],
['Revisar tu decisión puede aportar información; observa cuándo deja de ser útil.','Escuchar y contrastar con tus valores permite integrar perspectivas.','Defender tu postura puede protegerte, aunque a veces limita el diálogo.'],
['Buscar confirmación puede aliviar una duda por un momento; observa si luego reaparece.','Esperar es una opción cuando no hay una urgencia real.','Anticipar un resultado negativo puede parecer protección, pero no es evidencia.']];
frame('El espejo de mis decisiones','Reflejos posibles, no conclusiones sobre tu personalidad',`<div class="scene" aria-hidden="true">🪞</div>${answers.map((v,i)=>`<div class="reflection"><strong>Escena ${i+1}</strong><p>${esc(reflections[i][v]||'Hay más de una interpretación posible.')}</p></div>`).join('')}<p class="reflection-prompt">¿Qué influyó más en tus decisiones: una emoción, una necesidad, un valor, la seguridad o algo diferente?</p><label for="mirrorNote">Mi interpretación personal (opcional)</label><textarea class="textarea" id="mirrorNote" placeholder="Algo que descubro o quiero seguir explorando...">${esc(local.mirrorNote||'')}</textarea>${feedback('Estas tres escenas no permiten inferir rasgos, patrones estables ni diagnósticos. Tus respuestas pueden cambiar según la situación.','Elige una práctica pequeña y segura. Si esto te genera malestar persistente, puedes explorarlo con un profesional de psicología.') }<div class="btnrow">${btn('Copiar mi reflexión','copy:mirrorNote')}${btn('Volver a la biblioteca','home',true)}</div>`,100);break}
choiceScenario('El espejo de mis decisiones',`Escena ${step+1} de 3 · Sin respuestas ideales`,{icon:'🪞',text:c.text},c.opts,['¿Qué necesidad podría estar detrás de esta elección?','¿Qué ventaja y qué costo tendría en este contexto?','¿Cómo influyen la seguridad y tus valores?'],'No estás siendo evaluada. Observa cómo cambia la decisión según el contexto.');break}

}}
function finish(title,msg,action){frame(title,'Experiencia completada · Puedes regresar cuando lo necesites',`<div class="scene">🌷</div>${feedback(msg,action)}<p class="small">No es necesario sentirse mejor inmediatamente. La práctica puede continuar con apoyo profesional.</p><div class="btnrow">${btn('Elegir otra experiencia','home',true)}${btn('Repetir','repeat')}</div>`,100)}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;if(act==='home'){showHome();scrollTo(0,0)}else if(act==='explore'){document.getElementById('library')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})}else if(act.startsWith('start:'))start(act.slice(6));else if(act.startsWith('choose:')){answers[step]=Number(act.slice(7));render()}else if(act==='next'){step++;render();window.scrollTo(0,0)}else if(act.startsWith('first:')){local['first'+step]=Number(act.slice(6));render()}else if(act==='reveal'){local['phase'+step]=1;render()}else if(act==='repeat'){start(current)}else if(act.startsWith('safe:')){local.safe=Number(act.slice(5));render()}else if(act==='safeReset'){delete local.safe;render()}else if(act.startsWith('copy:')){let el=document.getElementById(act.slice(5));if(el&&navigator.clipboard?.writeText){navigator.clipboard.writeText(el.value).then(()=>{const m=document.createElement('p');m.setAttribute('role','status');m.textContent='Reflexión copiada. Decide dónde guardarla y quién puede verla.';el.after(m)}).catch(()=>{el.focus();el.select()})}else if(el){el.focus();el.select()}}else if(act==='finish'){finish('Una nueva forma de hablarte','No necesitas creer todas las frases que aparecen en tu mente.','Practica una respuesta respetuosa contigo en una situación real.')}else if(act.startsWith('emotion:')){local.emotion=act.slice(8);render()}else if(act.startsWith('toggle:')){let i=act.slice(7);local[i]=!local[i];render()}else if(act.startsWith('challenge:')){local.challenge=Number(act.slice(10));render()}});
app.addEventListener('input',e=>{if(e.target.id==='reflection')local.reflection=e.target.value;else if(e.target.id==='mirrorNote')local.mirrorNote=e.target.value;else if(e.target.id==='relationNote')local.relationNote=e.target.value;else if(e.target.id==='when')local.when=e.target.value;else if(e.target.id==='clueNote')local['clueNote'+e.target.dataset.step]=e.target.value;else if(e.target.id==='intensity'){local.intensity=e.target.value;document.getElementById('intVal').textContent=e.target.value}else if(e.target.id==='need')local.need=e.target.value});document.getElementById('homeBtn').addEventListener('click',()=>{showHome();scrollTo(0,0)});showHome(true);
</script></body></html>
